# Configuración de pytest para el paquete postura.
# Autor: Enrique Alberto Mendoza Ruiz, Universidad Panamericana (eamendoza@up.edu.mx)
# Fecha: 2026-09-27. Licencia: MIT.
# pythonpath = . permite importar el paquete postura desde la raíz del repositorio.
# Las pruebas marcadas como lento corren scripts completos con rejillas y datos reducidos;
# se omiten con: pytest -m "not lento"
[pytest]
pythonpath = .
testpaths = tests
markers =
    lento: prueba de integración que ejecuta scripts en un subproceso o completos con datos reducidos (entre 15 y 25 segundos en total)
filterwarnings =
    ignore::DeprecationWarning
